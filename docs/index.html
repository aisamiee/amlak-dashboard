<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مزایدهٔ املاک رضوی ۱۴۰۵</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a3529'/%3E%3Cpath d='M7 24 11 7l14 4-3 13z' fill='none' stroke='%237fd1b0' stroke-width='2.2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23dcab52'/%3E%3C/svg%3E">
<meta name="robots" content="noindex,nofollow">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مزایده رضوی">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
<script>try{const t=localStorage.getItem('amlak-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 32 32"><path d="M7 24 11 7l14 4-3 13z" fill="none" stroke="#7fd1b0" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.6" fill="#dcab52"/></svg></div>
      <div><b>مزایدهٔ املاک رضوی</b><span>پایش و ارزش‌گذاری · مشهد ۱۴۰۵</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="بخش‌ها"></nav>
    <div class="rail-foot">
      <div class="fresh" id="fresh"></div>
      <button class="theme-btn" id="themeBtn" type="button"></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="grow"><h1 id="vTitle">نمای کلی</h1><div class="sub" id="vSub"></div></div>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="جست‌وجوی قطعه، محله، بلوک… ( / )" autocomplete="off">
        <div class="search-res" id="qres" hidden></div>
      </div>
    </header>
    <div id="bannerSlot"></div>
    <main class="view" id="view"><div class="empty">در حال بارگذاری داده‌ها…</div></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<script src="vendor/leaflet.js"></script>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
